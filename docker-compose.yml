# Local Postgres for development and tests. Nothing hosted, nothing paid.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: switchboard
    ports:
      - "5432:5432"
    volumes:
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:

# Render blueprint: one web service + one Postgres. New → Blueprint → pick this repo.
# The schema is applied automatically every time the service starts.
services:
  - type: web
    name: switchboard
    runtime: node
    region: ohio
    plan: starter            # $7/mo; "free" also works but sleeps when idle (first request ~1 min)
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: switchboard-db
          property: connectionString
      # BASE_URL defaults to Render's own https URL (RENDER_EXTERNAL_URL).
      # Set it only if you add a custom domain, e.g. https://switchboard.tekhnea.com
databases:
  - name: switchboard-db
    region: ohio
    plan: basic-256mb        # ~$6/mo; Render's free Postgres expires after 30 days
    postgresMajorVersion: "16"
